name: Mutation pilot

# Plan 10, step 7: "Run mull or equivalent over domain/identity/ weekly;
# publish report. No gate yet." This uses the in-tree, dependency-free pilot
# (scripts/dev/mutation_pilot.py) rather than mull so it needs no special
# LLVM/clang plugin toolchain. It is informational: the job uploads a report
# artifact and never fails the build (the script always exits 0).

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:        # allow manual runs

jobs:
  mutation-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential \
            libboost-all-dev libssl-dev zlib1g-dev libcurl4-openssl-dev \
            liblua5.4-dev libsqlite3-dev libspdlog-dev
      - name: Configure (v3-dev)
        run: cmake --preset v3-dev
      - name: Run mutation pilot over domain/identity/
        run: |
          python3 scripts/dev/mutation_pilot.py \
            --build build/v3-dev \
            --max-mutants 0 \
            --json mutation-report.json | tee mutation-report.txt
      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-report.txt
