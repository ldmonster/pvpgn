repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(files/|lua/ghost/maplist\.txt)'
      - id: end-of-file-fixer
        exclude: '^(files/|conf/i18n/)'
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: '^(conf/.*\.win32|appveyor\.yml)'
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: '^files/'

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v17.0.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: ['-style=file']

  - repo: https://github.com/cheshirekow/cmake_format
    rev: v0.6.13
    hooks:
      - id: cmake-format
        args: ['--config-file=.cmake-format.yaml']
      - id: cmake-lint
        args: ['--config-file=.cmake-format.yaml']

  # Local architectural gates (Ring 1). These run the same scripts the local
  # aggregator scripts/dev/check-all.sh uses, so the dependency rule, domain
  # purity, and changelog discipline are enforced on every commit. They are
  # fast and require no build.
  - repo: local
    hooks:
      - id: v3-layering
        name: layer dependency rule (empty allow-list)
        entry: scripts/v3_layering_check.sh src
        language: script
        pass_filenames: false
        files: '^src/.*\.(cpp|hpp|h)$'
      - id: domain-purity
        name: domain layer purity
        entry: scripts/check_domain_purity.sh src/domain
        language: script
        pass_filenames: false
        files: '^src/domain/.*\.(cpp|hpp|h)$'
      - id: changelog-discipline
        name: CHANGELOG follows Keep a Changelog
        entry: scripts/dev/check-changelog.sh
        language: script
        pass_filenames: false
        files: '^CHANGELOG\.md$'
