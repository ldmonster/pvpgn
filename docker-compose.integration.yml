version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pvpgn_test
      MYSQL_DATABASE: pvpgn_test
      MYSQL_USER: pvpgn
      MYSQL_PASSWORD: pvpgn_test
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pvpgn_test
      POSTGRES_USER: pvpgn
      POSTGRES_PASSWORD: pvpgn_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvpgn"]
      interval: 5s
      timeout: 3s
      retries: 10
