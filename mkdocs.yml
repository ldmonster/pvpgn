site_name: PvPGN Documentation
site_description: PvPGN Battle.net emulator documentation
site_url: https://pvpgn.github.io/pvpgn/
repo_url: https://github.com/pvpgn/pvpgn
repo_name: pvpgn/pvpgn

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

nav:
  - Home: index.md
  - User Guide:
    - Ad Banners: user/adbanners.md
    - MOTD: user/bnmotd.md
    - Version Check: user/versioncheck.md
    - Observability: user/observability.md
    - Network Ports: user/ports.md
  - Operator Guide:
    - Building: operator/building.md
    - TOML Migration: operator/toml-migration.md
    - TOML Schema Versioning: operator/toml-schema-versioning.md
    - Metrics Reference: operator/metrics.md
    - Runbooks:
      - Diagnose Slow Login: operator/runbooks/diagnose-slow-login.md
      - Recover from Corrupt DB: operator/runbooks/recover-from-corrupt-db.md
      - Rolling Upgrade: operator/runbooks/rolling-upgrade.md
      - Connect OTel Collector: operator/runbooks/connect-otel-collector.md
      - Rotate argon2id Params: operator/runbooks/rotate-argon2id-params.md
  - Developer Guide:
    - Extending PvPGN: developer/extending-pvpgn.md
    - Lua API v2: developer/lua-api-v2.md
    - Plugin Versioning: developer/plugin-versioning-guide.md
    - Sandbox Integration: developer/sandbox-integration-guide.md
    - Single Binary Mode: developer/single-binary-mode.md
    - Config Reference: developer/config-reference.md
    - Testing: developer/testing.md
    - Benchmarking: developer/benchmarking.md
    - Scripts & Tooling: developer/scripts-and-tooling.md
    - Release Process: developer/release-process.md
    - Bounded Contexts:
      - Chat: developer/contexts/chat.md
      - Connection: developer/contexts/connection.md
      - D2CS: developer/contexts/d2cs.md
      - D2DBS: developer/contexts/d2dbs.md
      - Gameplay: developer/contexts/gameplay.md
      - Identity: developer/contexts/identity.md
      - Ladder: developer/contexts/ladder.md
      - Matchmaking: developer/contexts/matchmaking.md
      - Moderation: developer/contexts/moderation.md
      - Realm: developer/contexts/realm.md
      - Shared: developer/contexts/shared.md
      - Social: developer/contexts/social.md
  - Reference:
    - Overview: reference/index.md
    - Config Reference: developer/config-reference.md
  - ADRs:
    - Template: adr/NNNN-template.md
    - "0001 — TOML Configuration": adr/0001-use-toml-for-configuration.md
    - "0002 — Hexagonal Architecture": adr/0002-hexagonal-architecture.md
    - "0003 — Lua Plugin API v2": adr/0003-lua-plugin-api-v2.md
    - "0004 — Strangler Fig Pattern": adr/0004-strangler-fig-pattern.md
    - "0005 — Catch2 Test Framework": adr/0005-catch2-test-framework.md
    - "0006 — Async Runtime": adr/0006-async-runtime.md
    - "0007 — Migration Format": adr/0007-migration-format.md
    - "0008 — Crypto Libraries": adr/0008-crypto-libraries.md
    - "0009 — Modules Pilot": adr/0009-modules-pilot.md
    - "0010 — OTel Exporter": adr/0010-otel-exporter.md
    - "0011 — Runtime Image": adr/0011-runtime-image.md
  - History:
    - Alloc Survey: history/alloc-survey.md
    - Compat Survey: history/compat-survey.md
    - xalloc Migration: history/migration-xalloc-to-stl.md
    - fdwatch: history/fdwatch.md
    - Storage Backends: history/storage.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
