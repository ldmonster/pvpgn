site_name: PvPGN Documentation
site_description: PvPGN Battle.net emulator documentation
site_url: https://pvpgn.github.io/pvpgn/
repo_url: https://github.com/pvpgn/pvpgn
repo_name: pvpgn/pvpgn

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest

nav:
  - Home: index.md
  - User Guide:
    - Ad Banners: user/adbanners.md
    - MOTD: user/bnmotd.md
    - Version Check: user/versioncheck.md
    - Observability: user/observability.md
    - Network Ports: user/ports.md
  - Operator Guide:
    - Building: operator/building.md
    - TOML Migration: operator/toml-migration.md
    - TOML Schema Versioning: operator/toml-schema-versioning.md
  - Developer Guide:
    - Extending PvPGN: developer/extending-pvpgn.md
    - Lua API v2: developer/lua-api-v2.md
    - Plugin Versioning: developer/plugin-versioning-guide.md
    - Sandbox Integration: developer/sandbox-integration-guide.md
    - Single Binary Mode: developer/single-binary-mode.md
    - Config Reference: developer/config-reference.md
    - Testing: developer/testing.md
  - Reference:
    - Overview: reference/index.md
  - ADRs:
    - Template: adr/NNNN-template.md
    - "0001 — TOML Configuration": adr/0001-use-toml-for-configuration.md
    - "0002 — Hexagonal Architecture": adr/0002-hexagonal-architecture.md
    - "0003 — Lua Plugin API v2": adr/0003-lua-plugin-api-v2.md
    - "0004 — Strangler Fig Pattern": adr/0004-strangler-fig-pattern.md
    - "0005 — Catch2 Test Framework": adr/0005-catch2-test-framework.md
  - History:
    - Alloc Survey: history/alloc-survey.md
    - Compat Survey: history/compat-survey.md
    - xalloc Migration: history/migration-xalloc-to-stl.md
    - fdwatch: history/fdwatch.md
    - Storage Backends: history/storage.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
